name: Build Signed APK & Publish GitHub Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'apk-release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Auto-Incremented App Version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "${{ github.run_number }}")
          VERSION_CODE=$((100 + COMMIT_COUNT))
          VERSION_NAME="2.0.${COMMIT_COUNT}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_SLUG="${{ github.repository }}"
          APK_FILENAME="Biddut-Bill-v${VERSION_NAME}.apk"
          LATEST_APK_URL="https://github.com/${REPO_SLUG}/releases/download/v${VERSION_NAME}/${APK_FILENAME}"

          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "APK_FILENAME=${APK_FILENAME}" >> $GITHUB_OUTPUT
          echo "LATEST_APK_URL=${LATEST_APK_URL}" >> $GITHUB_OUTPUT

          # Extract recent git commits to automatically generate release notes
          COMMITS=$(git log -n 5 --no-merges --pretty=format:"• %s" || echo "• পারফরম্যান্স ও স্থায়িত্ব বৃদ্ধি")
          COMMIT_NOTES_JSON=$(echo "$COMMITS" | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
          if [ -z "$COMMIT_NOTES_JSON" ]; then
            COMMIT_NOTES_JSON="• স্বয়ংক্রিয় রিলিজ ও পারফরম্যান্স উন্নয়ন"
          fi

          echo "COMMITS<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Write public/version.json so both the APK and web host know the latest version
          cat > public/version.json <<EOF
          {
            "version": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "releaseTag": "v${VERSION_NAME}",
            "publishedAt": "${BUILD_DATE}",
            "apkUrl": "${LATEST_APK_URL}",
            "latestApkUrl": "https://github.com/${REPO_SLUG}/releases/latest/download/Biddut-Bill-latest.apk",
            "releasePageUrl": "https://github.com/${REPO_SLUG}/releases/tag/v${VERSION_NAME}",
            "notes": "${COMMIT_NOTES_JSON}"
          }
          EOF
          cat public/version.json

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 (for Android Gradle & APK Signing)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application Bundle
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION_NAME }}
          VITE_APP_VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Configure & Sync Capacitor Android Project
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION_NAME }}
          APP_VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/setup-android-apk.mjs
          npx cap sync android

      - name: Build Signed Release APK
        working-directory: ./android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'biddutbill2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'biddutbill' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'biddutbill2026' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Signed APK Artifacts
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated in android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found signed APK at: ${APK_PATH}"
          cp "${APK_PATH}" "release-artifacts/${{ steps.version.outputs.APK_FILENAME }}"
          cp "${APK_PATH}" "release-artifacts/Biddut-Bill-latest.apk"
          cp public/version.json "release-artifacts/version.json"
          ls -lh release-artifacts/

      - name: Publish Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION_NAME }}
          name: "বিদ্যুৎ বিল APK v${{ steps.version.outputs.VERSION_NAME }}"
          body: |
            ${{ steps.version.outputs.COMMITS }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-artifacts/${{ steps.version.outputs.APK_FILENAME }}
            release-artifacts/Biddut-Bill-latest.apk
            release-artifacts/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
