name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Auto-Incremented Version Metadata
        run: |
          RUN_NUM=${{ github.run_number }}
          VERSION_CODE=$((100 + RUN_NUM))
          VERSION_NAME="2.0.${RUN_NUM}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_SLUG="${{ github.repository }}"
          APK_FILENAME="Biddut-Bill-v${VERSION_NAME}.apk"
          cat > public/version.json <<EOF
          {
            "version": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "releaseTag": "v${VERSION_NAME}",
            "publishedAt": "${BUILD_DATE}",
            "apkUrl": "https://github.com/${REPO_SLUG}/releases/download/v${VERSION_NAME}/${APK_FILENAME}",
            "latestApkUrl": "https://github.com/${REPO_SLUG}/releases/latest/download/Biddut-Bill-latest.apk",
            "releasePageUrl": "https://github.com/${REPO_SLUG}/releases/tag/v${VERSION_NAME}",
            "signatureSha1": "A7:F8:FB:7B:E5:B5:E2:4F:6C:A2:43:CB:F2:E7:6F:D9:C5:0C:AE:62",
            "notes": "স্বয়ংক্রিয় বিল্ড v${VERSION_NAME} — অফলাইন অটো-সিঙ্ক, একই সিগনেচার আপডেট এবং উন্নত পারফরম্যান্স।"
          }
          EOF
          echo "VITE_APP_VERSION=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VITE_APP_VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VITE_GITHUB_REPO=${REPO_SLUG}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
