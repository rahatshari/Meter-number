<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>বিদ্যুৎ বিল</title>
    <meta name="description" content="Electricity Bill - বিদ্যুৎ বিল ও গ্রাহকের তথ্য সহজে ট্র্যাক এবং পরিচালনা করার অ্যাপ্লিকেশন">
    <meta property="og:title" content="বিদ্যুৎ বিল">
    <meta property="og:description" content="Electricity Bill - বিদ্যুৎ বিল ও গ্রাহকের তথ্য সহজে ট্র্যাক এবং পরিচালনা করার অ্যাপ্লিকেশন">
    
    <!-- PWA Links & Meta -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="বিদ্যুৎ বিল">
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./pwa-512x512.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <!-- Noto Sans Bengali font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- App Startup Splash Screen with official logo -->
    <div id="app-splash-screen" style="
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justifyContent: center;
        background-color: #FFFFFF;
        font-family: 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    ">
        <div style="
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: appSplashPulse 1.8s ease-in-out infinite;
        ">
            <div style="
                width: 92px;
                height: 92px;
                border-radius: 24px;
                background: #FFFFFF;
                border: 1px solid rgba(0,0,0,0.06);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
                display: flex;
                align-items: center;
                justifyContent: center;
                margin-bottom: 14px;
                overflow: hidden;
            ">
                <img src="./icon.png" alt="বিদ্যুৎ বিল" style="width: 76px; height: 76px; object-fit: contain;">
            </div>
            <h1 style="
                margin: 0;
                font-size: 22px;
                font-weight: 700;
                color: #1E293B;
                letter-spacing: -0.3px;
            ">বিদ্যুৎ বিল</h1>
            <p style="
                margin: 4px 0 0;
                font-size: 13px;
                color: #64748B;
                font-weight: 500;
            ">স্বয়ংক্রিয় অফলাইন ও ক্লাউড সিস্টেম</p>
        </div>
        <div style="
            position: absolute;
            bottom: 36px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #94A3B8;
        ">
            <div style="
                width: 14px;
                height: 14px;
                border: 2px solid #E2E8F0;
                border-top-color: #4F46E5;
                border-radius: 50%;
                animation: appSplashSpin 0.75s linear infinite;
            "></div>
            <span>অ্যাপ চালু হচ্ছে...</span>
        </div>
    </div>
    <style>
        @keyframes appSplashPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes appSplashSpin {
            to { transform: rotate(360deg); }
        }
    </style>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js', { scope: './' })
            .then(reg => console.log('SW Registered:', reg.scope))
            .catch(err => console.warn('SW Registration Error:', err));
        });
      }
    </script>
</body>
</html>
